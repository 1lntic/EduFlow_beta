<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>EduFlow</title><style>
:root{color-scheme:dark;--bg:#15151e;--panel:#242430;--raised:#30303f;--text:#f2f3fb;--muted:#a9a9be;--line:#383846;--blue:#55a5ff;--green:#8adbb2;--bad:#ffa0ac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}body.light{color-scheme:light;--bg:#f2f4fa;--panel:#fff;--raised:#e9edf7;--text:#202338;--muted:#646b83;--line:#dce1ed;--blue:#0869d8;--green:#257747;--bad:#b83e58}button,input{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}.brand{font-size:21px;font-weight:750;letter-spacing:-.5px}.mini{font-size:11px;color:var(--muted)}.header-info{flex:1;min-width:0}.icon{width:42px;height:44px;border-radius:14px;background:var(--panel);font-size:22px}.avatar{width:38px;height:38px;border-radius:13px;background:var(--raised);color:var(--blue);display:grid;place-items:center;font-weight:700}main{max-width:680px;margin:auto;padding:20px 16px 100px}h1{font-size:27px;letter-spacing:-.7px;line-height:1.2;margin:5px 0 16px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#234b80,#2a304c);color:#fff}.hero h2{font-size:24px;margin:10px 0}.hero .muted{color:#d0dcf1}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.grid .card{margin:0}.big{font-size:27px;font-weight:750;margin-top:5px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:10px;color:var(--muted)}.pill{padding:4px 9px;border-radius:20px;background:var(--raised);font-size:11px;color:var(--muted)}.primary{background:var(--blue);color:#071528;border-radius:13px;padding:10px 16px;font-weight:650}.secondary{background:var(--raised);border-radius:13px;padding:9px 14px}.grade{min-width:49px;height:49px;border-radius:14px;display:grid;place-items:center;background:var(--raised);color:var(--blue);font-size:25px;font-weight:750}.small{font-size:12px}.section{margin-top:23px}.unread{border-left:3px solid var(--blue)}.message{text-align:left;width:100%}.message strong{display:block}.message .mini{display:block;overflow-wrap:anywhere}.body-text{white-space:pre-wrap;overflow-wrap:anywhere}.date{width:100%;padding:10px 12px;background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:12px}.status{display:none;padding:10px 14px;background:var(--raised);font-size:12px;color:var(--muted)}.status.show{display:block}.status.error{color:var(--bad)}nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 6px calc(8px + env(safe-area-inset-bottom))}.bottom button{width:20%;max-width:130px;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:4px}.bottom .active{color:var(--blue)}svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.veil{position:fixed;inset:0;background:#0009;z-index:20;display:none}.veil.show{display:block}aside{height:100%;width:min(300px,85vw);background:var(--panel);padding:20px 10px;overflow-y:auto}aside .brand{padding:0 14px 20px}aside button{width:100%;text-align:left;border-radius:0 24px 24px 0;padding:11px 14px;display:flex;justify-content:space-between;gap:8px;font-size:14px}aside button.active{background:#096acb;color:#fff}aside button.unavailable{color:var(--muted)}aside small{font-size:9px;align-self:center;white-space:nowrap}.empty{text-align:center;padding:30px 18px}.empty p{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}.switch input{width:22px;height:22px;accent-color:var(--blue)}
</style></head><body>
<header><button class="icon" id="menu" aria-label="Otwórz menu">☰</button><div class="header-info"><div class="brand">EduFlow</div><div class="mini" id="subtitle">Twój dziennik</div></div><button class="icon" id="sync" aria-label="Synchronizuj">↻</button><button id="profile" class="avatar" aria-label="Wybierz profil">e</button></header>
<div id="status" class="status" role="status" aria-live="polite"></div><main id="main"></main>
<nav class="bottom" id="bottom"></nav><div class="veil" id="veil"><aside><div class="brand">EduFlow <span class="mini">Twój dziennik</span></div><div id="sections"></div></aside></div>
<script>
'use strict';
const icons={home:'<path d="M3 10 12 3 21 10M5 9v12h5v-7h4v7h5V9"/>',grades:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4"/>',plan:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2"/>',messages:'<path d="M6 18 3 21V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3ZM7 8h10M7 12h7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const modules=[['home','Tablica'],['achievements','Osiągnięcia'],['grades','Oceny'],['attendance','Frekwencja'],['plan','Plan zajęć'],['realization','Realizacja zajęć'],['remarks','Pochwały i uwagi'],['homework','Sprawdziany i zadania domowe'],['school','Szkoła'],['meals','Jadłospis'],['meetings','Zebrania'],['books','Podręczniki'],['office','Dostęp office'],['help','Pomoc'],['messages','Wiadomości'],['settings','Ustawienia']];
const supported=new Set(['home','grades','plan','messages','settings','help']);
let state={profile:null,messages:[],auto:true,theme:'dark',busy:false,status:'',needsLogin:true},page='home';
const main=document.getElementById('main');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e;}
function go(action,args={}){location.href='eduflow://'+action+(Object.keys(args).length?'?'+new URLSearchParams(args):'');}
function btn(label,action,cls='secondary'){const b=el('button',cls,label);b.onclick=action;return b;}
function card(title,details,cls=''){const c=el('section','card '+cls);if(title)c.append(el('h2','',title));if(details)c.append(el('div','muted small',details));return c;}
function stamp(v){if(!v)return 'Jeszcze nie pobrano';const d=new Date(v);return Number.isNaN(d.getTime())?'Brak daty':d.toLocaleString('pl-PL',{timeZone:'Europe/Warsaw',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function time(v){const m=String(v||'').match(/(?:T|^)(\d{2}:\d{2})/);return m?m[1]:String(v||'');}
function rows(v){return Array.isArray(v)?v:[];}
function switchPage(id){page=id;document.getElementById('veil').classList.remove('show');draw();if(id==='messages')go('inbox');}
function grade(g){const c=card('',''),r=el('div','row');r.append(el('div','grade',g.grade||'—'));const info=el('div');info.append(el('strong','',g.subject||'Przedmiot'));info.append(el('div','mini',[g.category,g.date,g.weight!=null?'waga '+g.weight:''].filter(Boolean).join(' · ')));r.append(info);c.append(r);if(g.comment)c.append(el('div','muted small',g.comment));return c;}
function lesson(l){const c=card(l.subject||'Zajęcia',[l.teacher,l.room?'sala '+l.room:''].filter(Boolean).join(' · '));c.prepend(el('div','mini',time(l.startsAt)+' – '+time(l.endsAt)));return c;}
function message(m){const c=el('button','card message'+(m.unread?' unread':''));c.append(el('strong','',m.subject||'(bez tematu)'),el('span','mini',m.sender||''),el('span','mini',[stamp(m.date),m.mailbox].filter(Boolean).join(' · ')));if(m.hasAttachments)c.append(el('span','mini','Zawiera załączniki — pobieranie jeszcze niepodłączone'));c.onclick=()=>go('read',{id:m.id});return c;}
function draw(){
  document.body.classList.toggle('light',state.theme==='light');main.replaceChildren();
  const p=state.profile,g=rows(p&&p.grades),ls=rows(p&&p.lessons),ms=rows(state.messages);
  document.getElementById('subtitle').textContent=p?[p.className,p.school].filter(Boolean).join(' · '):'Połącz konto eduVULCAN';
  document.getElementById('profile').textContent=p&&p.name?p.name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join(''):'e';
  const status=document.getElementById('status');status.textContent=state.busy?'Synchronizacja w toku…':(state.status||'');status.className='status'+(status.textContent?' show':'')+(state.error?' error':'');
  document.getElementById('sync').disabled=!!state.busy;
  const bottom=document.getElementById('bottom');bottom.replaceChildren();
  for(const [id,label,icon] of [['home','Tablica','home'],['grades','Oceny','grades'],['plan','Plan','plan'],['messages','Wiadomości','messages'],['settings','Więcej','more']]){const b=el('button',page===id?'active':'');const s=el('span');s.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[icon]+'</svg>';b.append(s,el('span','',label));b.onclick=()=>switchPage(id);bottom.append(b);}
  const menu=document.getElementById('sections');menu.replaceChildren();for(const [id,label] of modules){const b=el('button',(page===id?'active ':'')+(!supported.has(id)?'unavailable':''));b.append(el('span','',label));if(!supported.has(id))b.append(el('small','','Niepodłączone'));b.onclick=()=>switchPage(id);menu.append(b);}
  const title=(modules.find(m=>m[0]===page)||['','EduFlow'])[1];main.append(el('div','eyebrow','Twój szkolny dzień'),el('h1','',title));
  if(!supported.has(page)){main.append(card('Ta sekcja nie jest jeszcze podłączona','Menu odzwierciedla zakładki ze strony. Samo dodanie nazwy nie daje dostępu do danych — potrzebny jest sprawdzony adapter.'));return;}
  if(page==='settings'){
    const c=card('Automatyczna synchronizacja','Po połączeniu konta: przy otwarciu i powrocie do aplikacji oraz co około 5 minut podczas jej używania. Nie działa jako stale uruchomiona strona po zamknięciu aplikacji.');const r=el('label','switch','Włącz automatyczne odświeżanie');const input=el('input');input.type='checkbox';input.checked=state.auto!==false;input.onchange=()=>go('auto',{enabled:input.checked?'1':'0'});r.append(input);c.append(r);main.append(c);
    const a=card('Konto i wygląd','Hasło wpisujesz wyłącznie na prawdziwej stronie VULCAN.');const controls=el('div','toolbar');controls.append(btn('Zmień profil',()=>go('profile')),btn('Zaloguj ponownie',()=>go('login')),btn(state.theme==='light'?'Ciemny motyw':'Jasny motyw',()=>go('theme')));a.append(controls);main.append(a,btn('Usuń zapis i sesję',()=>go('logout')));return;
  }
  if(page==='help'){main.append(card('EduFlow • integracja testowa','Plan wybranego dnia, oceny z tablicy i webowa skrzynka konta. Inne zakładki nie są jeszcze podłączone. Nie omijamy uprawnień ani opłat.'));main.append(card('Prywatność','Zapis lokalny jest szyfrowany. Nie przesyłaj haseł, cookies ani tokenów. Przy błędzie SCHEMA podaj tylko kod, nie dane ucznia.'));return;}
  if(state.needsLogin){const c=card('Połącz dziennik','Strona oficjalna jest widoczna tylko do zalogowania lub ponownego uwierzytelnienia.');c.append(btn('Zaloguj się',()=>go('login'),'primary'));main.append(c);}
  if(page==='messages'){
    main.append(card('Skrzynka konta','Wiadomości z webowej skrzynki, nie filtrowane przez zgadywanie nazwiska ucznia. Zakres: ostatnie 50 pozycji. Aktualizacja: '+stamp(state.messagesFetchedAt)));
    if(state.message){const c=card(state.message.subject||'Wiadomość','Treść pobrana po wybraniu wiadomości. Otwarcie może zmienić status przeczytania w serwisie.');c.append(el('div','body-text',state.message.body||''));main.append(c,btn('Wróć do listy',()=>{state.message=null;draw();}));return;}
    if(!ms.length)main.append(card('Brak zapisanych wiadomości','Pusta lista lokalna nie potwierdza, że skrzynka serwera jest pusta.'));else ms.forEach(m=>main.append(message(m)));return;
  }
  if(!p){if(!state.needsLogin)main.append(card('Jeszcze nie ma danych','Trwa pierwsze pobieranie albo trzeba wybrać profil.'));return;}
  if(page==='grades'){main.append(card('Oceny z tablicy','To niekoniecznie wszystkie oceny semestru. Zapis: '+stamp(p.fetchedAt)));if(!g.length)main.append(card('Brak ocen w ostatnim zapisie','Zakres zwrócony przez endpoint tablicy.'));g.forEach(x=>main.append(grade(x)));return;}
  if(page==='plan'){const c=card('Dzień do pobrania','Zapisany plan: '+(p.date||'—')+' · '+stamp(p.fetchedAt));const input=el('input','date');input.type='date';input.value=state.targetDate||p.date||'';input.onchange=()=>go('date',{date:input.value});c.append(input);main.append(c);if(!ls.length)main.append(card('Brak zajęć w pobranym dniu','Serwer zwrócił pustą listę podczas ostatniej udanej synchronizacji.'));ls.forEach(x=>main.append(lesson(x)));return;}
  const h=card('Cześć, '+(p.name||'!'),'Ostatnia aktualizacja: '+stamp(p.fetchedAt),'hero');main.append(h);
  const grid=el('div','grid');for(const [label,n] of [['Oceny z tablicy',g.length],['Zajęcia · '+(p.date||'—'),ls.length]]){const c=card('',label);c.append(el('div','big',n));grid.append(c);}main.append(grid);
  main.append(el('h2','section','Plan · '+(p.date||'—')));ls.slice(0,3).forEach(x=>main.append(lesson(x)));main.append(el('h2','section','Ostatnie oceny z tablicy'));g.slice(0,3).forEach(x=>main.append(grade(x)));
}
window.EduFlow={render(value){state={...state,...value};draw();},showMessage(value){state.message=value;page='messages';draw();}};
document.getElementById('menu').onclick=()=>document.getElementById('veil').classList.add('show');document.getElementById('veil').onclick=e=>{if(e.target.id==='veil')e.target.classList.remove('show');};document.getElementById('sync').onclick=()=>go('sync');document.getElementById('profile').onclick=()=>go('profile');draw();
</script></body></html>
